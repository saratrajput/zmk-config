# Deep sleep: power down the MCU after inactivity (biggest idle-drain fix)
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Reduce battery-level BLE reports (default is 60s); 600s = every 10 min
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=600

# Improved BLE connection stability/efficiency (planned to be default upstream)
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# Split battery: fetch the peripheral (right) level to the central, and proxy it
# to the host as a second Battery Service instance. See tools/zmk-battery-menubar/
# to actually read it (macOS only shows the first battery level).
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
